name: Gmail API OAuth delivery regression

on:
  push:
    branches: [feat/gmail-api-oauth-delivery-20261109]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: OAuth, MIME and delivery safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test simulated Gmail API requests (no real emails, no secrets)
        run: node --test scripts/gmail-api-regression.test.mjs
      - name: Test application email receipt and manual retry safeguards
        run: node --test scripts/application-email-delivery.test.mjs
      - name: Test private admin routing policy
        run: node --test scripts/private-admin-entry.test.mjs
      - name: Test admin announcements and recipient isolation
        run: node --test scripts/admin-announcements.test.mjs
      - name: Test searchable recipients, email channels and retry safety
        run: node --test scripts/admin-announcement-channels.test.mjs
      - name: Test responsive HTML announcements and plain text fallback
        run: node --test scripts/admin-announcement-email-format.test.mjs
      - name: Test automatic task review emails, ledger, and preferences
        run: node --test scripts/task-review-email-notifications.test.mjs scripts/notification-preferences.test.mjs
      - name: Type-check Next.js application
        run: npx tsc --noEmit
      - name: Lint application email admin UI and route
        run: npx eslint 'app/admin/applications/[id]/page.tsx' app/api/notifications/send/route.ts lib/email/application-delivery.ts
      - name: Lint private admin routing and guard
        run: npx eslint lib/auth/admin-route-gate.ts lib/supabase/middleware.ts app/admin/layout.tsx
      - name: Lint admin announcements
        run: npx eslint app/admin/notifications/page.tsx app/api/admin/announcements/route.ts app/api/admin/announcements/students/route.ts app/api/admin/announcements/deliver-emails/route.ts lib/announcements/validation.ts lib/announcements/text-format.ts lib/email/announcement-template.ts app/dashboard/notifications/page.tsx lib/notifications/inbox.ts
      - name: Lint task review email route and shared submission flow
        run: npx eslint app/api/admin/submissions/review-email/route.ts lib/email/task-review-template.ts lib/email/request-task-review.ts lib/submissions/service.ts app/admin/submissions/page.tsx 'app/admin/submissions/[id]/page.tsx' app/dashboard/settings/page.tsx lib/notification-preferences.ts
