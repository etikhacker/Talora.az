name: Gmail API OAuth delivery regression

on:
  push:
    branches: [feat/gmail-api-oauth-delivery-20261109]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: OAuth, MIME and delivery safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test simulated Gmail API requests (no real emails, no secrets)
        run: node --test scripts/gmail-api-regression.test.mjs
      - name: Type-check Next.js application
        run: npx tsc --noEmit
