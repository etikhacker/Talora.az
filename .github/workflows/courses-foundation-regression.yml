name: Courses foundation static regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/courses-foundation-20261109]

permissions:
  contents: read

jobs:
  courses-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Courses static regression
        run: node --test scripts/courses-foundation.test.mjs
