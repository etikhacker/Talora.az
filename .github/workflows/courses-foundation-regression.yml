name: Courses foundation static regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/courses-foundation-20261109]

permissions:
  contents: read

jobs:
  courses-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with no retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Courses static regression
        run: node --test scripts/courses-foundation.test.mjs

  courses-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: talora_test
          POSTGRES_DB: talora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply fixture, migration and verify row-level security
        env:
          PGPASSWORD: talora_test
        run: |
          set -euo pipefail
          for file in \
            scripts/courses-foundation-fixture.sql \
            supabase/migrations/20261109000000_courses_foundation.sql \
            scripts/courses-foundation-integration.sql; do
            echo "::group::SQL test: $file"
            docker run --rm --network host -e PGPASSWORD \
              -v "$PWD:/workspace:ro" postgres:17 \
              psql -X -h 127.0.0.1 -U postgres -d talora_test \
              -v ON_ERROR_STOP=1 -f "/workspace/$file"
            echo "::endgroup::"
          done
