name: Internship tracks regression

on:
  push:
    branches: [feat/internship-tracks-free-20261109]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  internship-tracks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify taxonomy, admin forms, and public catalogue
        run: node --test scripts/internship-tracks.test.mjs

  curricula-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: talora_test
          POSTGRES_DB: talora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Apply seed against synthetic Postgres 17 schema and verify
        env:
          PGPASSWORD: talora_test
        run: |
          set -euo pipefail
          for script in \
            scripts/internship-curricula-fixture.sql \
            scripts/seed-new-career-internships-2026.sql \
            scripts/internship-curricula-verify.sql \
            scripts/internship-admin-rls-fixture.sql \
            scripts/internship-admin-select-policy.sql \
            scripts/internship-admin-rls-verify.sql; do
            docker run --rm --network host -e PGPASSWORD \
              -v "$PWD:/workspace:ro" postgres:17 \
              psql -X -h 127.0.0.1 -U postgres -d talora_test \
                -v ON_ERROR_STOP=1 -f "/workspace/$script"
          done
