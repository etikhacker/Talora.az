name: Student notification badges regression

on:
  push:
    branches: [feat/student-notification-badges-20261109]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify student inbox badges and arrival alerts
        run: node --test scripts/student-notification-badges.test.mjs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: talora_test
          POSTGRES_PASSWORD: talora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate student-only update grant with RLS
        env:
          PGPASSWORD: talora_test
        run: |
          set -euo pipefail
          for file in \
            scripts/student-notification-test-fixture.sql \
            scripts/student-inbox-read-grant.sql \
            scripts/student-notification-test-verify.sql; do
            docker run --rm --network host -e PGPASSWORD \
              -v "$PWD:/workspace:ro" postgres:17 \
              psql -X -h 127.0.0.1 -U postgres -d talora_test \
                -v ON_ERROR_STOP=1 -f "/workspace/$file"
          done
