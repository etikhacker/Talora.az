name: Student activity and compact cards regression

on:
  push:
    branches: [feat/student-activity-compact-cards-20261109]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify admin activity and compact catalogue
        run: node --test scripts/student-activity-compact.test.mjs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: talora_test
          POSTGRES_PASSWORD: talora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify login metadata isolation and event summaries
        env:
          PGPASSWORD: talora_test
        run: |
          set -euo pipefail
          for file in \
            scripts/student-activity-fixture.sql \
            scripts/student-presence-and-admin-activity.sql \
            scripts/student-activity-verify.sql; do
            docker run --rm --network host -e PGPASSWORD \
              -v "$PWD:/workspace:ro" postgres:17 \
              psql -X -h 127.0.0.1 -U postgres -d talora_test \
              -v ON_ERROR_STOP=1 -f "/workspace/$file"
          done
